<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1E3A2F">
<title>La Manada</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#1E3A2F;
    --pine-2:#2A4D3E;
    --moss:#4E7A5A;
    --field:#EDF2E6;
    --card:#FFFFFF;
    --honey:#E8A13D;
    --honey-deep:#C97F1B;
    --bark:#6B4F3A;
    --ink:#22302A;
    --muted:#6E7D74;
    --line:#DCE5D6;
    --alert:#C4552F;
    --radius:18px;
    --shadow:0 2px 10px rgba(30,58,47,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Nunito Sans',system-ui,-apple-system,sans-serif;
    background:var(--field);
    color:var(--ink);
    font-size:16px;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;color:var(--pine)}

  /* ---------- Header ---------- */
  header{
    background:var(--pine);
    color:#F4F8F1;
    padding:calc(10px + env(safe-area-inset-top)) 18px 11px;
    display:flex;align-items:center;justify-content:space-between;
  }
  header .brand{font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:#F4F8F1;display:flex;align-items:center;gap:8px}
  header .paw{font-size:20px}
  .who-switch{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px;gap:2px}
  .who-switch button{
    border:none;background:transparent;color:#DCE8DD;font-family:inherit;
    font-weight:700;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;
  }
  .who-switch button.on{background:var(--honey);color:var(--pine)}

  main{padding:12px 14px 8px;max-width:520px;margin:0 auto}

  /* ---------- Dog selector ---------- */
  .dog-row{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
  .dog-row::-webkit-scrollbar{display:none}
  .dog-chip{flex:0 0 auto;text-align:center;cursor:pointer;border:none;background:none;font-family:inherit}
  .dog-chip .ring{
    width:76px;height:76px;border-radius:50%;padding:3px;margin:0 auto;
    background:var(--line);transition:background .15s;
  }
  .dog-chip.sel .ring{background:var(--honey)}
  .dog-chip .ph{
    width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#fff;
  }
  .dog-chip .ph-empty{
    width:100%;height:100%;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;
  }
  .dog-chip .nm{font-weight:800;font-size:13px;margin-top:6px;color:var(--ink)}
  .dog-chip.sel .nm{color:var(--pine)}
  .dog-chip.add .ring{background:transparent;border:2px dashed var(--moss)}
  .dog-chip.add .ph-empty{background:transparent;color:var(--moss);font-size:26px}
  .dog-chip.add .nm{color:var(--moss)}

  /* ---------- Quick log ---------- */
  .section-label{
    font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);margin:14px 2px 10px;
  }
  .quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .qbtn{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 4px 11px;text-align:center;cursor:pointer;font-family:inherit;
    box-shadow:var(--shadow);transition:transform .08s;
  }
  .qbtn:active{transform:scale(.94)}
  .qbtn .ic{font-size:26px;display:block;margin-bottom:5px}
  .qbtn .lb{font-size:12px;font-weight:800;color:var(--pine)}

  /* ---------- Timeline ---------- */
  .timeline{position:relative;margin:4px 0 8px;padding-left:26px}
  .timeline::before{
    content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;
    background:repeating-linear-gradient(to bottom,var(--moss) 0 5px,transparent 5px 11px);
    opacity:.5;
  }
  .entry{
    position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:11px 13px;margin-bottom:9px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:11px;cursor:pointer;
  }
  .entry::before{
    content:"🐾";position:absolute;left:-26px;top:50%;transform:translateY(-50%);
    font-size:13px;filter:grayscale(.2);
  }
  .entry .eic{font-size:22px}
  .entry .body{flex:1;min-width:0}
  .entry .t1{font-weight:800;font-size:14.5px;color:var(--pine)}
  .entry .t2{font-size:12.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .entry .time{font-size:12px;font-weight:800;color:var(--bark);text-align:right;line-height:1.3}
  .entry .time small{display:block;font-weight:700;color:var(--muted)}
  .entry.pending{border:1.5px dashed var(--honey-deep);background:#FFF9EF}
  .dup{
    display:inline-block;background:#FBEAE3;color:var(--alert);font-size:10.5px;
    font-weight:800;padding:2px 8px;border-radius:999px;vertical-align:middle;
    text-transform:uppercase;letter-spacing:.04em;
  }
  .day-head{
    font-family:'Fraunces',serif;font-weight:700;font-size:15px;color:var(--pine);
    margin:14px 2px 8px;
  }
  .fchips{margin-bottom:10px}
  .fchips button{padding:7px 13px;font-size:13px}
  .dash-chips{margin-bottom:14px}
  .dash-chips button{display:inline-flex;align-items:center;gap:7px}
  .dash-chips img{width:22px;height:22px;border-radius:50%;object-fit:cover;display:block}
  .wbig{font-family:'Fraunces',serif;font-size:27px;font-weight:700;color:var(--pine)}
  .wbig small{font-size:13px;color:var(--muted);font-family:'Nunito Sans',sans-serif;font-weight:700}
  .wrow{
    display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--field);
    font-size:13.5px;color:var(--ink);
  }
  .wrow span:first-child{flex:1}
  .wrow span:nth-child(2){color:var(--muted);font-size:12.5px}
  .xdel{
    border:none;background:var(--field);color:var(--alert);border-radius:8px;
    width:26px;height:26px;font-size:12px;cursor:pointer;flex-shrink:0;font-weight:800;
  }
  .rx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:6px}
  .rx-item{position:relative}
  .rx-item img{
    width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;
    border:1.5px solid var(--line);display:block;cursor:pointer;background:var(--field);
  }
  .rx-date{
    position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:800;color:#fff;
    background:linear-gradient(transparent,rgba(20,32,26,.75));padding:14px 6px 4px;
    border-radius:0 0 10px 10px;text-align:center;pointer-events:none;
  }
  .rx-x{position:absolute;top:5px;right:5px;background:rgba(255,255,255,.92)}
  .rx-view{
    position:fixed;inset:0;background:rgba(12,20,16,.92);z-index:120;
    display:flex;align-items:center;justify-content:center;padding:16px;cursor:pointer;
  }
  .rx-view img{max-width:100%;max-height:100%;border-radius:10px}
  #dogSel button{display:inline-flex;align-items:center;gap:7px}
  #dogSel img{width:20px;height:20px;border-radius:50%;object-fit:cover;display:block}
  .cl-item{
    display:flex;gap:11px;align-items:flex-start;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow);
  }
  .cl-act{
    font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
    padding:3px 9px;border-radius:999px;margin-top:2px;flex-shrink:0;
  }
  .cl-act.added{background:#E4F0E4;color:var(--moss)}
  .cl-act.edited{background:#FFF3DC;color:var(--honey-deep)}
  .cl-act.deleted{background:#FBEAE3;color:var(--alert)}
  .cl-what{font-size:13.5px;font-weight:700;color:var(--ink)}
  .cl-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .export-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .exbtn{
    border:1.5px solid var(--pine);background:var(--card);color:var(--pine);
    border-radius:14px;padding:12px 8px;font-family:inherit;font-weight:800;
    font-size:13.5px;cursor:pointer;box-shadow:var(--shadow);
  }
  .exbtn:active{background:var(--pine);color:#fff}
  .sync-bar{
    background:#FFF3DC;border:1.5px dashed var(--honey-deep);border-radius:14px;
    padding:11px 14px;font-size:13px;font-weight:700;color:var(--bark);
    margin-bottom:12px;cursor:pointer;line-height:1.45;
  }
  .sync-bar b{color:var(--honey-deep)}
  .welcome{
    min-height:calc(100dvh - 220px);
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;padding:26px 22px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);margin-top:6px;
  }
  .welcome p{color:var(--muted);font-size:15px;line-height:1.55;max-width:320px}
  .welcome .btn{max-width:320px}
  .w-icons{display:flex;gap:12px;margin-bottom:20px}
  .w-icons img{width:58px;height:58px;border-radius:16px;border:1.5px solid var(--line)}
  .empty{
    text-align:center;color:var(--muted);padding:26px 16px;font-size:14.5px;
    background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
  }
  .empty b{color:var(--pine)}

  /* ---------- Dashboard ---------- */
  .stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .stat{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;box-shadow:var(--shadow);
  }
  .stat .big{font-family:'Fraunces',serif;font-size:30px;font-weight:700;color:var(--pine);line-height:1}
  .stat .big small{font-size:15px;color:var(--moss);font-family:'Nunito Sans',sans-serif;font-weight:800}
  .stat .cap{font-size:12px;font-weight:800;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.06em}
  .chart-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 14px 12px;box-shadow:var(--shadow);margin-bottom:12px;
  }
  .chart-card h3{font-size:16px;margin-bottom:12px}
  .bars{display:flex;align-items:flex-end;gap:7px;height:110px}
  .barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
  .bar{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--moss);min-height:3px;position:relative}
  .bar.hny{background:var(--honey)}
  .bar .v{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:11px;font-weight:800;color:var(--pine)}
  .barcol .d{font-size:11px;font-weight:800;color:var(--muted)}
  .split{margin-top:4px}
  .split .srow{margin-bottom:15px}
  .split .slbl{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:5px}
  .split .slbl span:last-child{color:var(--moss)}
  .split .slbl2{font-size:11.5px;font-weight:700;color:var(--muted);margin:6px 0 4px}
  .split .slbl2 span:last-child{color:var(--bark)}
  .split .track{height:12px;border-radius:999px;background:var(--field);overflow:hidden}
  .split .track.thin{height:7px}
  .split .fill{height:100%;border-radius:999px;background:var(--honey)}
  .split .fill.g{background:var(--moss)}
  .mini-note{font-size:12.5px;color:var(--muted);margin-top:8px}
  .seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:14px}
  .seg button{flex:1;border:none;background:transparent;font-family:inherit;font-weight:800;font-size:13px;padding:8px;border-radius:999px;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--pine);color:#fff}

  /* ---------- Bottom nav ---------- */
  nav{
    position:fixed;left:0;right:0;bottom:0;background:var(--card);
    border-top:1px solid var(--line);display:flex;
    padding:4px 8px calc(4px + env(safe-area-inset-bottom));
    max-width:100%;z-index:40;
  }
  nav button{
    flex:1;border:none;background:none;font-family:inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 4px;
    color:var(--muted);font-size:11px;font-weight:800;border-radius:12px;
  }
  nav button .nic{font-size:20px}
  nav button.on{color:var(--pine);background:var(--field)}

  /* ---------- Sheet ---------- */
  .scrim{position:fixed;inset:0;background:rgba(20,32,26,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--card);
    border-radius:22px 22px 0 0;padding:14px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(105%);transition:transform .22s cubic-bezier(.3,.9,.3,1);
    max-width:560px;margin:0 auto;max-height:86vh;overflow-y:auto;
  }
  .sheet.open{transform:translateY(0)}
  .sheet .grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
  .sheet h2{font-size:21px;margin-bottom:2px;display:flex;align-items:center;gap:9px}
  .sheet .sub{font-size:13.5px;color:var(--muted);margin-bottom:14px}
  .fld{margin-bottom:13px}
  .fld label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
  .fld input[type=text],.fld input[type=number],.fld textarea,.fld input[type=time],.fld input[type=date]{
    width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;
    font-family:inherit;font-size:16px;background:#FDFDFB;color:var(--ink);
  }
  .fld textarea{resize:none;min-height:64px}
  .fld input:focus,.fld textarea:focus{outline:none;border-color:var(--moss)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips button{
    border:1.5px solid var(--line);background:#FDFDFB;border-radius:999px;
    padding:8px 15px;font-family:inherit;font-weight:800;font-size:14px;color:var(--ink);cursor:pointer;
  }
  .chips button.on{background:var(--pine);border-color:var(--pine);color:#fff}
  .btn{
    width:100%;border:none;border-radius:14px;padding:15px;font-family:inherit;
    font-weight:800;font-size:16px;cursor:pointer;
  }
  .btn.pri{background:var(--honey);color:var(--pine)}
  .btn.pri:active{background:var(--honey-deep);color:#fff}
  .btn.ghost{background:none;color:var(--muted);padding:11px;font-size:14px}
  .btn.danger{background:#FBEAE3;color:var(--alert);margin-top:8px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pix{image-rendering:pixelated}
  .icon-row{display:flex;gap:10px}
  .ipick{
    border:2px solid var(--line);background:#FDFDFB;border-radius:50%;
    width:58px;height:58px;padding:0;cursor:pointer;overflow:hidden;flex-shrink:0;
  }
  .ipick img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
  .ipick:active{border-color:var(--honey)}
  .photo-pick{display:flex;align-items:center;gap:14px}
  .photo-pick .prev{width:70px;height:70px;border-radius:50%;object-fit:cover;background:var(--field);display:flex;align-items:center;justify-content:center;font-size:28px}
  .photo-pick .pbtn{border:1.5px dashed var(--moss);background:none;border-radius:12px;padding:11px 16px;font-family:inherit;font-weight:800;color:var(--moss);cursor:pointer;font-size:14px}

  /* Settings */
  .set-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
  .set-card h3{font-size:16px;margin-bottom:10px}
  .dog-line{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--field)}
  .dog-line:last-child{border-bottom:none}
  .dog-line img,.dog-line .noimg{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--field);display:flex;align-items:center;justify-content:center;font-size:20px}
  .dog-line .n{flex:1;font-weight:800;color:var(--pine)}
  .dog-line .edit{border:none;background:var(--field);border-radius:10px;padding:8px 13px;font-family:inherit;font-weight:800;color:var(--pine);cursor:pointer;font-size:13px}
  .toast{
    position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--pine);color:#fff;padding:11px 20px;border-radius:999px;font-weight:800;font-size:14px;
    opacity:0;transition:all .25s;z-index:90;pointer-events:none;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.25);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .loading{text-align:center;padding:50px 20px;color:var(--muted);font-weight:700}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="paw">🐾</span> La Manada</div>
  <div class="who-switch" id="whoSwitch"></div>
</header>

<main id="main"><div class="loading">Buscando a la manada…</div></main>

<nav>
  <button id="navHome" class="on" onclick="go('home')"><span class="nic">🏠</span>Hoy</button>
  <button id="navDash" onclick="go('dash')"><span class="nic">📊</span>Panel</button>
  <button id="navHist" onclick="go('hist')"><span class="nic">📖</span>Historial</button>
  <button id="navSet" onclick="go('settings')"><span class="nic">⚙️</span>Ajustes</button>
</nav>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" accept="image/*" id="photoInput" style="display:none">
<input type="file" accept="image/*" id="rxInput" style="display:none">

<script>
/* =============== Base de datos compartida (Firebase) =============== */
/* PASO ÚNICO DE CONFIGURACIÓN:
   Pega abajo la URL de tu Firebase Realtime Database.
   Se ve así:  https://tu-proyecto-default-rtdb.firebaseio.com  */
const FIREBASE_URL = "https://manada-k9x42-default-rtdb.firebaseio.com/";
const DB_PATH = "manada-v1";
function fbPath(key){
  return FIREBASE_URL.replace(/\/+$/,"") + "/" + DB_PATH + "/" + key.replace(/[.#$\[\]\/]/g,"_") + ".json";
}
window.storage = {
  async get(key){
    const r = await fetch(fbPath(key));
    if(!r.ok) throw new Error("get failed");
    const v = await r.json();
    if(v===null || v===undefined) throw new Error("not found");
    return {key, value:String(v)};
  },
  async set(key, value){
    const r = await fetch(fbPath(key), {method:"PUT", body:JSON.stringify(String(value))});
    if(!r.ok) throw new Error("set failed");
    return {key, value};
  },
  async delete(key){
    const r = await fetch(fbPath(key), {method:"DELETE"});
    if(!r.ok) throw new Error("delete failed");
    return {key, deleted:true};
  }
};

/* =============== Config =============== */
const TYPES = {
  walk:    {ic:"🚶", label:"Paseo"},
  food:    {ic:"🍖", label:"Comida"},
  med:     {ic:"💊", label:"Remedio"},
  water:   {ic:"💧", label:"Agua"},
  toilet:  {ic:"💩", label:"Pipí/Caca"},
  vet:     {ic:"🩺", label:"Vet"},
  groom:   {ic:"🛁", label:"Baño"},
  note:    {ic:"📝", label:"Nota"},
};

/* =============== Storage helpers =============== */
async function sGet(key){
  try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function sSet(key,val){
  try{ await window.storage.set(key, JSON.stringify(val), true); return true; }
  catch(e){ toast("No se pudo guardar — revisa tu conexión"); return false; }
}
function monthKey(d){ return "logs:" + d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
function lastMonthKeys(n){
  const keys=[]; const d=new Date();
  for(let i=0;i<n;i++){ keys.push(monthKey(new Date(d.getFullYear(), d.getMonth()-i, 1))); }
  return keys;
}
async function loadAll(){
  const [dg, st, cl] = await Promise.all([sGet("dogs"), sGet("settings"), sGet("changelog")]);
  dogs = dg || [];
  if(st && st.people) settings = st;
  if(cl) changelog = cl;
  const keys = lastMonthKeys(3);
  const res = await Promise.all(keys.map(k=>sGet(k)));
  keys.forEach((k,i)=>{
    if(res[i]) logs[k] = res[i];
    else if(!logs[k]) logs[k] = [];   // keep existing in-memory data if fetch came back empty
  });
  if(dogs.length && !selectedDog) selectedDog = dogs[0].id;
}
async function writeEntry(entry){
  const k = monthKey(new Date(entry.ts));
  const fresh = (await sGet(k)) || [];
  const map = new Map(fresh.map(e=>[e.id,e]));
  (logs[k]||[]).forEach(e=>{ if(!map.has(e.id)) map.set(e.id,e); });
  map.set(entry.id, entry);
  const merged = [...map.values()].sort((a,b)=>a.ts-b.ts);
  try{
    await window.storage.set(k, JSON.stringify(merged), true);
    logs[k] = merged;
    return true;
  }catch(e){ return false; }
}
async function saveEntry(entry){
  const ok = await writeEntry(entry);
  if(!ok){
    pendingQueue.push(entry);
    toast("Sin señal — guardado en el teléfono, se enviará ⏳");
  }
  return ok;
}
async function writeChange(rec){
  try{
    const fresh = (await sGet("changelog")) || [];
    fresh.push(rec);
    changelog = fresh.slice(-200);   // keep the last 200 changes
    await window.storage.set("changelog", JSON.stringify(changelog), true);
    return true;
  }catch(e){ return false; }
}
async function logChange(action, entry){
  const dog = dogs.find(d=>d.id===entry.dogId);
  const rec = { ts:Date.now(), who:settings.people[who], action,
    what:(TYPES[entry.type]?TYPES[entry.type].label:entry.type)+" · "+(dog?dog.name:"?")+" · "+
         new Date(entry.ts).toLocaleString('es-CL')+(entry.detail?" · "+entry.detail:"") };
  const ok = await writeChange(rec);
  if(!ok) pendingChanges.push(rec);
}
function dupIds(entries){
  const flagged = new Set();
  const arr = [...entries].sort((a,b)=>a.ts-b.ts);
  for(let i=0;i<arr.length;i++){
    for(let j=i+1;j<arr.length;j++){
      if(arr[j].ts - arr[i].ts > 10*60000) break;
      if(arr[i].dogId===arr[j].dogId && arr[i].type===arr[j].type){ flagged.add(arr[i].id); flagged.add(arr[j].id); }
    }
  }
  return flagged;
}
async function flushQueue(){
  if(flushing || (!pendingQueue.length && !pendingChanges.length)) return;
  flushing = true;
  const batch = [...pendingQueue];
  let sent = 0;
  for(const e of batch){
    const ok = await writeEntry(e);
    if(ok){ pendingQueue = pendingQueue.filter(x=>x.id!==e.id); sent++; }
    else break; // still offline — stop, retry later
  }
  while(pendingChanges.length){
    const ok = await writeChange(pendingChanges[0]);
    if(ok) pendingChanges.shift(); else break;
  }
  flushing = false;
  if(sent && !pendingQueue.length){ toast("De vuelta en línea — todo sincronizado ✓"); render(); }
  else if(sent){ render(); }
}
window.addEventListener("online", flushQueue);
setInterval(flushQueue, 20000);
async function deleteEntry(entry){
  const k = monthKey(new Date(entry.ts));
  const fresh = (await sGet(k)) || logs[k] || [];
  const filtered = fresh.filter(e=>e.id!==entry.id);
  logs[k] = filtered;
  await sSet(k, filtered);
}
function allEntries(){
  const saved = Object.values(logs).flat();
  const savedIds = new Set(saved.map(e=>e.id));
  return saved.concat(pendingQueue.filter(e=>!savedIds.has(e.id)));
}
function isPending(id){ return pendingQueue.some(e=>e.id===id); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* =============== UI helpers =============== */
const $ = id => document.getElementById(id);
function esc(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200);
}
function fmtTime(ts){ const d=new Date(ts); return d.toTimeString().slice(0,5); }
function dayLabel(d){ return ["dom","lun","mar","mié","jue","vie","sáb"][d.getDay()]; }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }

/* =============== Sheet =============== */
function openSheet(html){ $("sheet").innerHTML='<div class="grab"></div>'+html; $("sheet").classList.add("open"); $("scrim").classList.add("open"); }
function closeSheet(){ $("sheet").classList.remove("open"); $("scrim").classList.remove("open"); pendingPhoto=null; }

    `<button class="${i===who?'on':''}" onclick="who=${i};renderWho()">${esc(p)}</button>`).join("");
}

/* =============== Views =============== */
function go(v){ view=v; render(); }
function render(){
  ["navHome","navHist","navDash","navSet"].forEach(id=>$(id).classList.remove("on"));
  $({home:"navHome",hist:"navHist",dash:"navDash",settings:"navSet"}[view]).classList.add("on");
  renderWho();
  if(view==="home") renderHome();
  else if(view==="hist") renderHistory();
  else if(view==="dash") renderDash();
  else renderSettings();
}
function localDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function dogTap(id){
  if(selectedDog===id) openFicha(id);
  else { selectedDog=id; render(); }
}
function dogChipHtml(d, sel){
  const img = d.photo ? `<img class="ph ${d.photo.startsWith('data:image/png')?'pix':''}" src="${d.photo}" alt="${esc(d.name)}">` : `<div class="ph-empty">🐕</div>`;
  return `<button class="dog-chip ${sel?'sel':''}" onclick="dogTap('${d.id}')">
    <div class="ring">${img}</div><div class="nm">${esc(d.name)}</div></button>`;
}

function renderHome(){
  const m=$("main");
  if(!dogs.length){
    m.innerHTML = `<div class="welcome">
      <div class="w-icons">${DOG_ICONS.map(u=>`<img src="${u}" class="pix" alt="">`).join("")}</div>
      <h2 style="font-size:24px;margin-bottom:10px">Bienvenidos a La Manada</h2>
      <p>Agrega tu primer perro para empezar a registrar paseos, comidas y remedios — compartido en vivo entre ustedes dos.</p>
      <button class="btn pri" style="margin-top:22px" onclick="dogForm()">Agregar un perro</button>
      <div class="mini-note" style="margin-top:14px">Después podrás sumar al resto de la manada desde la pantalla principal.</div>
    </div>`;
    return;
  }
  const isAll = selectedDog==="all";
  const allChip = dogs.length>1 ? `<button class="dog-chip ${isAll?'sel':''}" onclick="selectedDog='all';render()">
    <div class="ring"><div class="ph-empty">🐾</div></div><div class="nm">Todos</div></button>` : "";
  const dogHtml = allChip + dogs.map(d=>dogChipHtml(d, d.id===selectedDog)).join("") +
    `<button class="dog-chip add" onclick="dogForm()"><div class="ring"><div class="ph-empty">＋</div></div><div class="nm">Agregar</div></button>`;

  const qHtml = Object.entries(TYPES).map(([k,t])=>
    `<button class="qbtn" onclick="logForm('${k}')"><span class="ic">${t.ic}</span><span class="lb">${t.label}</span></button>`).join("");

  const today = new Date();
  const dog = isAll ? null : dogs.find(d=>d.id===selectedDog);
  const dogName = isAll ? "toda la manada" : dog.name;
  const todays = allEntries()
    .filter(e=>(isAll || e.dogId===selectedDog) && sameDay(new Date(e.ts), today))
    .sort((a,b)=>b.ts-a.ts);

  let tl;
  if(!todays.length){
    tl = `<div class="empty">Aún no hay registros de <b>${esc(dogName)}</b> hoy.<br>Toca un botón arriba después de un paseo o una comida.</div>`;
  } else {
    const dups=dupIds(todays);
    tl = `<div class="timeline">` + todays.map(e=>{
      const t=TYPES[e.type]||TYPES.note;
      const pend=isPending(e.id);
      const dg=isAll?dogs.find(x=>x.id===e.dogId):null;
      const sub=[dg?dg.name:null, e.note||null].filter(Boolean).join(" · ");
      return `<div class="entry ${pend?'pending':''}" onclick='entrySheet(${JSON.stringify(JSON.stringify(e))})'>
        <span class="eic">${t.ic}</span>
        <div class="body"><div class="t1">${t.label}${e.detail?` · <span style="font-weight:700;color:var(--ink)">${esc(e.detail)}</span>`:""}${dups.has(e.id)?' <span class="dup">posible duplicado</span>':""}</div>
        ${sub?`<div class="t2">${esc(sub)}</div>`:""}</div>
        <div class="time">${fmtTime(e.ts)}<small>${pend?"⏳ pendiente":esc(e.who||"")}</small></div></div>`;
    }).join("") + `</div>`;
  }

  const syncBar = pendingQueue.length
    ? `<div class="sync-bar" onclick="flushQueue()">⏳ ${pendingQueue.length} ${pendingQueue.length===1?"registro":"registros"} esperando señal — se envían solos. Mantén la app abierta. <b>Toca para reintentar</b></div>`
    : "";
  m.innerHTML = `
    ${syncBar}
    <div class="dog-row">${dogHtml}</div>
    <div class="section-label">Registro rápido · ${esc(isAll?"Toda la manada":dog.name)}</div>
    <div class="quick-grid">${qHtml}</div>
    <div class="section-label">Hoy</div>
    ${tl}`;
}

}
function chipField(label, opts, sel){
  return `<div class="fld"><label>${label}</label><div class="chips" id="chipRow">${
    opts.map(o=>`<button class="${sel===o?'on':''}" onclick="pickChip(this,'${o}')">${o}</button>`).join("")}</div></div>`;
}
function pickChip(btn,val){
  document.querySelectorAll("#chipRow button").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on"); form.detail=val;
}
function toggleDog(id,btn){
  const i=form.dogIds.indexOf(id);
  if(i>=0){
    if(form.dogIds.length===1){ toast("Elige al menos un perro"); return; }
    form.dogIds.splice(i,1); btn.classList.remove("on");
  } else {
    form.dogIds.push(id); btn.classList.add("on");
  }
}
async function submitLog(){
  const dEl=$("fDetail"); if(dEl) form.detail=dEl.value.trim();
  const time=$("fTime").value||"00:00", date=$("fDate").value;
  const ts=new Date(date+"T"+time).getTime();
  const note=($("fNote").value||"").trim();
  if(editing){
    const entry={...editing, ts, detail:form.detail||"", note};
    if(monthKey(new Date(editing.ts))!==monthKey(new Date(ts))) await deleteEntry(editing);
    editing=null;
    closeSheet();
    await saveEntry(entry);
    logChange("edited", entry);
    toast("Actualizado ✓");
    render();
    return;
  }
  const ids=(form.dogIds&&form.dogIds.length)?form.dogIds:[selectedDog];
  closeSheet();
  for(const id of ids){
    const e={ id:uid(), dogId:id, type:form.type, ts,
      who:settings.people[who], detail:form.detail||"", note };
    await saveEntry(e);
    logChange("added", e);
  }
  toast(ids.length>1 ? "Guardado para "+ids.length+" perros ✓" : "Guardado ✓");
  render();
}

/* =============== Export =============== */
function ensureXLSX(){
  if(window.XLSX) return Promise.resolve(true);
  return new Promise(res=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload=()=>res(true); s.onerror=()=>res(false);
    document.head.appendChild(s);
  });
}
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
async function exportData(fmt){
  const entries=allEntries()
    .filter(e=>(histDog==="all"||e.dogId===histDog)&&(histType==="all"||e.type===histType))
    .sort((a,b)=>a.ts-b.ts);
  if(!entries.length){ toast("Nada que exportar con estos filtros"); return; }
  const rows=entries.map(e=>{
    const dog=dogs.find(x=>x.id===e.dogId);
    return { Fecha:localDate(new Date(e.ts)), Hora:fmtTime(e.ts),
      Perro:dog?dog.name:"?", Tipo:TYPES[e.type]?TYPES[e.type].label:e.type,
      Detalle:e.detail||"", Nota:e.note||"", "Registrado por":e.who||"" };
  });
  const fname="manada-"+localDate(new Date());
  if(fmt==="csv"){
    const heads=Object.keys(rows[0]);
    const csv=[heads.join(",")]
      .concat(rows.map(r=>heads.map(h=>'"'+String(r[h]??"").replace(/"/g,'""')+'"').join(",")))
      .join("\r\n");
    downloadBlob(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}), fname+".csv");
    toast("CSV exportado ✓");
  } else {
    toast("Preparando Excel…");
    const ok=await ensureXLSX();
    if(!ok){ toast("No se pudo cargar Excel — prueba con CSV"); return; }
    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.json_to_sheet(rows);
    ws["!cols"]=[{wch:11},{wch:6},{wch:12},{wch:10},{wch:18},{wch:28},{wch:12}];
    XLSX.utils.book_append_sheet(wb, ws, "Registros");
    if(changelog.length){
      const cl=changelog.map(c=>({Fecha:new Date(c.ts).toLocaleString('es-CL'), Quién:c.who||"", Acción:ACT[c.action]||c.action, Detalle:c.what}));
      const ws2=XLSX.utils.json_to_sheet(cl);
      ws2["!cols"]=[{wch:19},{wch:12},{wch:9},{wch:50}];
      XLSX.utils.book_append_sheet(wb, ws2, "Cambios");
    }
    const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
    downloadBlob(new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}), fname+".xlsx");
    toast("Excel exportado ✓");
  }
}

/* =============== Dashboard =============== */
function renderDash(){
  const m=$("main");
  if(!dogs.length){ m.innerHTML=`<div class="empty" style="margin-top:30px">Agrega un perro primero para ver las estadísticas.</div>`; return; }
  if(dashDog!=="all" && !dogs.find(d=>d.id===dashDog)) dashDog="all";
  const scopeAll = dashDog==="all";
  const dog = scopeAll ? null : dogs.find(d=>d.id===dashDog);
  const src = allEntries().filter(e=> scopeAll || e.dogId===dashDog);

  const now=new Date();
  const days=[...Array(7)].map((_,i)=>{ const d=new Date(now); d.setDate(d.getDate()-(6-i)); d.setHours(0,0,0,0); return d; });
  const in7 = e => e.ts >= days[0].getTime();

  const walks7 = src.filter(e=>e.type==="walk" && in7(e));
  const meals7 = src.filter(e=>e.type==="food" && in7(e));
  const meds7  = src.filter(e=>e.type==="med" && in7(e));
  const walksByDay = days.map(d=>walks7.filter(e=>sameDay(new Date(e.ts),d)).length);
  const mealsByDay = days.map(d=>meals7.filter(e=>sameDay(new Date(e.ts),d)).length);

  // avg walk duration from chips like "30 min"/"1 h+"
  const durs = walks7.map(e=>{
    const mch=(e.detail||"").match(/(\d+)\s*min/); if(mch) return +mch[1];
    if(/1\s*h/.test(e.detail||"")) return 60; return null;
  }).filter(v=>v!==null);
  const avgDur = durs.length ? Math.round(durs.reduce((a,b)=>a+b,0)/durs.length) : null;

  // care split (last 7 days, all activity + walk minutes)
  const act7 = src.filter(in7);
  const counts = settings.people.map(p=>act7.filter(e=>e.who===p).length);
  const totalAct = counts.reduce((a,b)=>a+b,0)||1;
  const durOf = e => {
    const mch=(e.detail||"").match(/(\d+)\s*min/); if(mch) return +mch[1];
    if(/1\s*h/.test(e.detail||"")) return 60; return 0;
  };
  const walkMins = settings.people.map(p=>walks7.filter(e=>e.who===p).reduce((a,e)=>a+durOf(e),0));
  const totalMins = walkMins.reduce((a,b)=>a+b,0)||1;

  const maxW=Math.max(...walksByDay,1), maxM=Math.max(...mealsByDay,1);
  const barRow=(vals,max,cls)=>`<div class="bars">${vals.map((v,i)=>
    `<div class="barcol"><div class="bar ${cls}" style="height:${Math.max(4,v/max*88)}px">${v?`<span class="v">${v}</span>`:""}</div><span class="d">${dayLabel(days[i])}</span></div>`).join("")}</div>`;

  m.innerHTML = `
    <div class="chips fchips dash-chips">
      <button class="${scopeAll?'on':''}" onclick="dashDog='all';render()">🐾 Toda la manada</button>
      ${dogs.map(d=>`<button class="${dashDog===d.id?'on':''}" onclick="dashDog='${d.id}';render()">${
        d.photo?`<img src="${d.photo}" class="${d.photo.startsWith('data:image/png')?'pix':''}" alt="">`:""}${esc(d.name)}</button>`).join("")}
    </div>
    <div class="stat-row">
      <div class="stat"><div class="big">${walks7.length}</div><div class="cap">Paseos · 7 días</div></div>
      <div class="stat"><div class="big">${avgDur!==null?avgDur+"<small> min</small>":"–"}</div><div class="cap">Paseo promedio</div></div>
      <div class="stat"><div class="big">${meals7.length}</div><div class="cap">Comidas · 7 días</div></div>
      <div class="stat"><div class="big">${meds7.length}</div><div class="cap">Dosis · 7 días</div></div>
    </div>
    <div class="chart-card"><h3>🚶 Paseos por día</h3>${barRow(walksByDay,maxW,"")}</div>
    <div class="chart-card"><h3>🍖 Comidas por día</h3>${barRow(mealsByDay,maxM,"hny")}</div>
    <div class="chart-card"><h3>🤝 ¿Quién hace la pega?</h3>
      <div class="split">${settings.people.map((p,i)=>`
        <div class="srow"><div class="slbl"><span>${esc(p)}</span><span>${counts[i]} registros · ${Math.round(counts[i]/totalAct*100)}%</span></div>
        <div class="track"><div class="fill ${i%2?'g':''}" style="width:${counts[i]/totalAct*100}%"></div></div>
        <div class="slbl slbl2"><span>🚶 Minutos paseando</span><span>${walkMins[i]} min · ${Math.round(walkMins[i]/totalMins*100)}%</span></div>
        <div class="track thin"><div class="fill ${i%2?'g':''}" style="width:${walkMins[i]/totalMins*100}%"></div></div></div>`).join("")}
      </div>
      <div class="mini-note">Registros y minutos de paseo de los últimos 7 días${scopeAll?" de toda la manada":" de "+esc(dog.name)}. Los minutos se calculan según la duración elegida en cada paseo.</div>
    </div>`;
}

function fichaSnapshot(){ const t=$("fMedical"); if(t) fichaMedical=t.value; }
function fichaAddWeight(){
  fichaSnapshot();
  const kg=parseFloat(($("fKg").value||"").replace(",","."));
  if(!kg||kg<=0){ toast("Ingresa un peso válido"); return; }
  fichaWeights.push({ts:Date.now(), kg:Math.round(kg*10)/10});
  renderFicha();
}
function fichaDelWeight(i){ fichaSnapshot(); fichaWeights.splice(i,1); renderFicha(); }
function fichaAddMed(){
  fichaSnapshot();
  const name=($("fMedName").value||"").trim();
  const freq=($("fMedFreq").value||"").trim();
  if(!name){ toast("Escribe el nombre del remedio"); return; }
  fichaMeds.push({name, freq});
  renderFicha();
}
function fichaDelMed(i){ fichaSnapshot(); fichaMeds.splice(i,1); renderFicha(); }
function fichaDelRx(i){ fichaSnapshot(); fichaRx.splice(i,1); renderFicha(); }
function viewRx(i){
  const r=fichaRx[i]; if(!r) return;
  const v=document.createElement("div");
  v.className="rx-view";
  v.innerHTML=`<img src="${r.img}" alt="Receta">`;
  v.onclick=()=>v.remove();
  document.body.appendChild(v);
}
$("rxInput").addEventListener("change", ev=>{
  const f=ev.target.files[0]; if(!f) return;
  if(fichaRx.length>=8){ toast("Máximo 8 recetas — elimina una antigua"); ev.target.value=""; return; }
  const img=new Image();
  img.onload=()=>{
    const MAX=1100;
    const r=Math.min(1, MAX/Math.max(img.width,img.height));
    const c=document.createElement("canvas");
    c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const data=c.toDataURL("image/jpeg",0.62);
    const projected=JSON.stringify(fichaRx).length + data.length;
    if(projected > 4500000){ toast("Espacio lleno — elimina una receta antigua"); }
    else { fichaRx.push({id:uid(), ts:Date.now(), img:data}); renderFicha(); }
    URL.revokeObjectURL(img.src);
  };
  img.src=URL.createObjectURL(f);
  ev.target.value="";
});
async function saveFicha(){
  fichaSnapshot();
  const fresh=(await sGet("dogs"))||dogs;
  const d=fresh.find(x=>x.id===fichaDog);
  if(d){ d.weights=fichaWeights; d.medical=fichaMedical.trim(); d.meds=fichaMeds; }
  dogs=fresh;
  const ok=await sSet("dogs",dogs);
  const ok2=await sSet("rx:"+fichaDog, fichaRx);
  if(!ok||!ok2) return;   // keep the sheet open so nothing is lost
  closeSheet(); toast("Ficha guardada ✓"); render();
}

/* =============== Settings =============== */
function renderSettings(){
  const m=$("main");
  const dogLines = dogs.length ? dogs.map(d=>`
    <div class="dog-line">
      ${d.photo?`<img src="${d.photo}" class="${d.photo.startsWith('data:image/png')?'pix':''}" alt="">`:`<div class="noimg">🐕</div>`}
      <span class="n">${esc(d.name)}</span>
      <button class="edit" onclick="openFicha('${d.id}')">Ficha</button>
      <button class="edit" onclick="dogForm('${d.id}')">Editar</button>
    </div>`).join("") : `<div class="mini-note">Aún no hay perros.</div>`;
  m.innerHTML = `
    <div class="set-card"><h3>🐕 Tu manada</h3>${dogLines}
      <button class="btn ghost" style="text-align:left;padding-left:0;color:var(--moss)" onclick="dogForm()">＋ Agregar un perro</button></div>
    <div class="set-card"><h3>👥 Personas</h3>
      <div class="fld"><label>Persona 1</label><input type="text" id="p1" value="${esc(settings.people[0])}"></div>
      <div class="fld"><label>Persona 2</label><input type="text" id="p2" value="${esc(settings.people[1])}"></div>
      <button class="btn pri" onclick="savePeople()">Guardar nombres</button></div>
    <div class="set-card"><h3>ℹ️ Datos compartidos</h3>
      <div class="mini-note">Los datos viven en tu propia base de datos (Firebase) — lo que registre cualquiera de los dos aparece en ambos teléfonos. Agrega esta página a tu pantalla de inicio (Compartir → Agregar a pantalla de inicio) para que se abra como una app a pantalla completa.</div></div>`;
}
async function savePeople(){
  settings.people=[$("p1").value.trim()||"Persona 1", $("p2").value.trim()||"Persona 2"];
  await sSet("settings",settings);
  toast("Nombres guardados ✓"); render();
}

/* =============== Dog add / edit =============== */
function dogForm(id){
  const d = id ? dogs.find(x=>x.id===id) : null;
  pendingPhoto = d ? d.photo||null : null;
  photoTarget = id||null;
  openSheet(`
    <h2>${d?"Editar a "+esc(d.name):"Agregar un perro"}</h2>
    <div class="sub">${d?"Actualiza sus datos o su foto.":"Un nombre y una foto — eso es todo."}</div>
    <div class="fld"><label>Nombre</label><input type="text" id="dogName" placeholder="ej. Luna" value="${d?esc(d.name):""}"></div>
    <div class="fld"><label>Foto</label>
      <div class="photo-pick">
        <div id="photoPrev" class="prev">${pendingPhoto?`<img src="${pendingPhoto}" class="${pendingPhoto.startsWith('data:image/png')?'pix':''}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`:"📷"}</div>
        <button class="pbtn" onclick="$('photoInput').click()">${pendingPhoto?"Cambiar foto":"Tomar o elegir foto"}</button>
      </div></div>
    <div class="fld"><label>O elige un ícono</label>
      <div class="icon-row">${DOG_ICONS.map((u,i)=>`<button class="ipick" onclick="pickIcon(${i})"><img src="${u}" class="pix" alt=""></button>`).join("")}</div></div>
    <button class="btn pri" onclick="saveDog()">${d?"Guardar cambios":"Sumar a la manada"}</button>
    ${d?`<button class="btn danger" onclick="removeDog('${d.id}')">Eliminar perro</button>`:""}
    <button class="btn ghost" onclick="closeSheet()">Cancelar</button>
  `);
}
function pickIcon(i){
  pendingPhoto = DOG_ICONS[i];
  const p=$("photoPrev");
  if(p) p.innerHTML=`<img src="${pendingPhoto}" class="pix" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
}
$("photoInput").addEventListener("change", ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement("canvas"); const S=240; c.width=S; c.height=S;
    const ctx=c.getContext("2d");
    const r=Math.max(S/img.width,S/img.height);
    const w=img.width*r,h=img.height*r;
    ctx.drawImage(img,(S-w)/2,(S-h)/2,w,h);
    pendingPhoto=c.toDataURL("image/jpeg",0.72);
    const p=$("photoPrev"); if(p) p.innerHTML=`<img src="${pendingPhoto}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
    URL.revokeObjectURL(img.src);
  };
  img.src=URL.createObjectURL(f);
  ev.target.value="";
});
async function saveDog(){
  const name=$("dogName").value.trim();
  if(!name){ toast("Ponle un nombre al perro 🐶"); return; }
  const fresh=(await sGet("dogs"))||dogs;
  if(photoTarget){
    const d=fresh.find(x=>x.id===photoTarget);
    if(d){ d.name=name; d.photo=pendingPhoto; }
  } else {
    fresh.push({id:uid(), name, photo:pendingPhoto});
  }
  dogs=fresh;
  await sSet("dogs",dogs);
  if(selectedDog!=="all" && (!selectedDog||!dogs.find(d=>d.id===selectedDog))) selectedDog=dogs[0]?dogs[0].id:null;
  if(!photoTarget) selectedDog=dogs[dogs.length-1].id;
  closeSheet(); toast(name+" guardado ✓"); go("home");
}
async function removeDog(id){
  const fresh=((await sGet("dogs"))||dogs).filter(d=>d.id!==id);
  dogs=fresh; await sSet("dogs",dogs);
  try{ await window.storage.delete("rx:"+id, true); }catch(e){}
  if(selectedDog===id) selectedDog=dogs[0]?dogs[0].id:null;
  closeSheet(); toast("Perro eliminado"); render();
}

/* =============== Boot =============== */
(async function(){
  if(FIREBASE_URL.includes("PEGA_AQUI")){
    $("main").innerHTML = `<div class="welcome">
      <div style="font-size:40px;margin-bottom:12px">🔧</div>
      <h2 style="font-size:22px;margin-bottom:10px">Falta un paso de configuración</h2>
      <p>Abre <b>index.html</b> y pega la URL de tu Firebase Realtime Database en la línea <b>FIREBASE_URL</b>, cerca del inicio del código. Luego guarda y recarga.</p></div>`;
    return;
  }
  await loadAll();
  render();
  // light auto-refresh so entries from the other phone appear
  setInterval(async ()=>{
    if(document.querySelector(".sheet.open")) return;
    if(navigator.onLine===false) return;   // offline: keep what we have on screen
    await flushQueue();
    await loadAll(); render();
  }, 60000);
})();
</script>
